name: Pages

on:
  # semantic-release pushes the version tag with the gjed-release app token,
  # so this runs for every release.
  push:
    tags:
      - "v*"
  # The project list is read from the GitHub API at build time; rebuild weekly
  # so a new Pages project shows up without a release.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A pre-release tag (v1.2.3-rc.1) must not replace the stable page.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scheduled and manual runs start on main; publish the latest release,
      # never unreleased commits.
      - name: Check out the latest release
        if: ${{ github.ref_type != 'tag' }}
        run: git checkout "$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*')"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python build.py --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # deploy-pages looks the artifact up as soon as it starts; in the job that uploaded it the
  # lookup can still come back empty (actions/deploy-pages#451). A later job always sees it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
